services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
      POSTGRES_DB: hotel
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hotel -d hotel']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://hotel:hotel@postgres:5432/hotel
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 3001
      WEB_ORIGIN: http://localhost:3000
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3001/api
    environment:
      # Used only by server-side rendering, which runs inside this container and must
      # reach the api service by its Docker Compose network name, not "localhost".
      API_INTERNAL_URL: http://api:3001/api
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres-data:

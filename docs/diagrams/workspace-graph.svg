<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img">
  <title>Dependency graph of a seven-project Rush workspace</title>
  <desc>Seven project boxes in three rows, joined by five solid blue runtime dependency arrows and ten dashed grey dev-only tooling arrows that point from each project to the shared ESLint and TypeScript config packages.</desc>
  <defs>
    <marker id="arrowSolid" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="12" refY="4.5" orient="auto" viewBox="0 0 12 9">
      <path d="M0,0 L12,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowDev" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto" viewBox="0 0 9 7">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>

  <text x="36" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Rush workspace: dependency graph</text>

  <rect x="140" y="70" width="180" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="230" y="103" font-family="system-ui, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle">@hotel/web</text>

  <rect x="600" y="70" width="180" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="690" y="103" font-family="system-ui, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle">@hotel/api</text>

  <rect x="60" y="230" width="180" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="150" y="263" font-family="system-ui, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle">@hotel/ui</text>

  <rect x="330" y="230" width="180" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="420" y="263" font-family="system-ui, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle">@hotel/api-client</text>

  <rect x="600" y="230" width="180" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="690" y="263" font-family="system-ui, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle">@hotel/shared-types</text>

  <rect x="140" y="410" width="180" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="230" y="430" font-family="system-ui, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle">@hotel/</text>
  <text x="230" y="448" font-family="system-ui, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle">eslint-config</text>

  <rect x="600" y="410" width="180" height="54" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="690" y="430" font-family="system-ui, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle">@hotel/</text>
  <text x="690" y="448" font-family="system-ui, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle">typescript-config</text>

  <path d="M 700 124 L 700 230" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <path d="M 510 257 L 600 257" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <path d="M 240 124 L 240 160 L 620 160 L 620 230" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <path d="M 300 124 L 300 177 L 420 177 L 420 230" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <path d="M 180 124 L 180 230" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowSolid)"/>

  <path d="M 140 85 L 36 85 L 36 424 L 140 424" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowDev)"/>
  <path d="M 140 108 L 24 108 L 24 482 L 700 482 L 700 464" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowDev)"/>
  <path d="M 780 85 L 910 85 L 910 490 L 240 490 L 240 464" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowDev)"/>
  <path d="M 650 284 L 650 355 L 300 355 L 300 410" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowDev)"/>
  <path d="M 490 284 L 490 312 L 720 312 L 720 410" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowDev)"/>
  <path d="M 780 108 L 880 108 L 880 340 L 775 340 L 775 410" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowDev)"/>
  <path d="M 380 284 L 380 330 L 200 330 L 200 410" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowDev)"/>
  <path d="M 150 284 L 150 410" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowDev)"/>
  <path d="M 750 284 L 750 410" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowDev)"/>
  <path d="M 170 284 L 170 346 L 640 346 L 640 410" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrowDev)"/>

  <line x1="40" y1="524" x2="90" y2="524" stroke="#2563eb" stroke-width="2.5" fill="none"/>
  <text x="102" y="529" font-family="system-ui, sans-serif" font-size="15" fill="#0f172a">runtime dependency</text>
  <line x1="300" y1="524" x2="350" y2="524" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" fill="none"/>
  <text x="362" y="529" font-family="system-ui, sans-serif" font-size="15" fill="#0f172a">dev-only dependency (tooling)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img">
<title>Pull request CI pipeline with a build cache decision</title>
<desc>Left to right pull request flow: sparse partial clone, compute affected projects from the merge-base diff, test the build cache, then either restore cached outputs or run fmt, lint, typecheck, build and test, and finally report status.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth">
<path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
</marker>
</defs>
<rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>
<text x="20" y="40" fill="#0f172a" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">Pull request pipeline</text>
<rect x="20" y="110" width="190" height="60" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="115" y="140" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="middle">sparse / partial clone</text>
<rect x="250" y="110" width="190" height="60" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="345" y="129" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="middle">compute affected projects</text>
<text x="345" y="151" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="middle">(merge-base diff)</text>
<path d="M 480 140 L 565 95 L 650 140 L 565 185 Z" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/>
<text x="565" y="140" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="middle">build cache hit?</text>
<rect x="500" y="20" width="180" height="70" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="590" y="44" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="middle">restore cached outputs</text>
<text x="590" y="66" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="middle">(no rebuild)</text>
<rect x="480" y="330" width="200" height="100" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="580" y="358" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="middle">format-check, lint,</text>
<text x="580" y="380" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="middle">typecheck, build,</text>
<text x="580" y="402" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="middle">test (affected only)</text>
<rect x="700" y="170" width="190" height="60" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="795" y="200" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="middle">report status</text>
<line x1="210" y1="140" x2="250" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="440" y1="140" x2="480" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="650" y1="140" x2="650" y2="90" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="565" y1="185" x2="565" y2="330" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="680" y1="55" x2="720" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="680" y1="380" x2="740" y2="230" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<text x="658" y="115" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14">hit</text>
<text x="575" y="265" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14">miss</text>
<text x="40" y="385" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14">typecheck runs before any build</text>
<path d="M 277 385 L 480 390" fill="none" stroke="#94a3b8" stroke-width="1"/>
<text x="740" y="385" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14">generated-file drift check:</text>
<text x="740" y="407" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14">routeTree.gen.ts</text>
<path d="M 735 383 L 680 400" fill="none" stroke="#94a3b8" stroke-width="1"/>
<text x="180" y="72" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14">cache key: sources + deps + toolchain</text>
<path d="M 440 70 L 518 120" fill="none" stroke="#94a3b8" stroke-width="1"/>
</svg>

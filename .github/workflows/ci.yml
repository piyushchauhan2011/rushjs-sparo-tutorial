name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          # Must satisfy "nodeSupportedVersionRange" in rush.json (>=20.9.0 <25).
          # TypeORM 1.x also requires Node 20+.
          node-version: 22
      - name: Rush install
        run: node common/scripts/install-run-rush.js install
      - name: Check formatting
        run: node common/scripts/install-run-rush.js format:check
      - name: Lint
        run: node common/scripts/install-run-rush.js lint
      - name: Typecheck
        run: node common/scripts/install-run-rush.js typecheck
      - name: Rush rebuild
        # No "--production": it is not a built-in Rush parameter (it would have to
        # be declared under "parameters" in common/config/rush/command-line.json),
        # and Rush 5 rejects it with "Unrecognized arguments: --production".
        run: node common/scripts/install-run-rush.js rebuild --verbose

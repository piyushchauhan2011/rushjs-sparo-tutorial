<line x1="492" y1="230" x2="492" y2="262" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="812" y1="70" x2="812" y2="100" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="812" y1="150" x2="812" y2="180" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="812" y1="230" x2="812" y2="262" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img">
<title>Three lane architecture: developer machine, CI, and the shared remote build cache</title>
<desc>Top lane is the developer machine: sparo clone, sparo checkout with the profile web, rush install, rush build, then a local cache. A dashed arrow drops from sparo checkout to a dim note that the common skeleton is always present. Middle lane is CI: sparo-ci checkout treeless clone, select affected projects from the git merge base, run format-check, lint, typecheck and build, then produce an artifact or image. Bottom lane is the shared remote build cache, read from and written to by the local cache, and read by the CI build step.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth">
<path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
</marker>
<marker id="arrow-dim" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth">
<path d="M 0 0 L 10 5 L 0 10 Z" fill="#94a3b8"/>
</marker>
</defs>
<rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>
<rect x="20" y="60" width="960" height="230" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="20" y="320" width="960" height="170" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="20" y="520" width="960" height="150" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
<text x="40" y="96" fill="#0f172a" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">Developer machine</text>
<text x="40" y="356" fill="#0f172a" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">CI</text>
<text x="500" y="552" fill="#0f172a" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Shared</text>
<rect x="40" y="108" width="168" height="72" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="124" y="150" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">sparo clone</text>
<rect x="228" y="108" width="168" height="72" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="312" y="139" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">sparo checkout</text>
<text x="312" y="159" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">--profile web</text>
<rect x="416" y="108" width="168" height="72" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="500" y="150" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">rush install</text>
<rect x="604" y="108" width="168" height="72" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="688" y="150" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">rush build</text>
<rect x="792" y="108" width="168" height="72" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="876" y="132" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">local cache</text>
<text x="876" y="151" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">(cacheProvider:</text>
<text x="876" y="170" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">local-only)</text>
<rect x="222" y="214" width="280" height="50" rx="6" fill="#f1f5f9" fill-opacity="0.35" stroke="#94a3b8" stroke-opacity="0.35" stroke-width="2"/>
<text x="362" y="236" fill="#94a3b8" fill-opacity="0.55" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Skeleton: common/**</text>
<text x="362" y="256" fill="#94a3b8" fill-opacity="0.55" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">always present</text>
<rect x="40" y="368" width="160" height="72" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="120" y="399" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">sparo-ci checkout</text>
<text x="120" y="419" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">(treeless clone)</text>
<rect x="220" y="368" width="210" height="72" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="325" y="399" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">select affected projects</text>
<text x="325" y="419" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">(--from git:origin/main)</text>
<rect x="450" y="368" width="176" height="72" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="538" y="399" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">format-check, lint,</text>
<text x="538" y="419" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">typecheck, build</text>
<rect x="646" y="368" width="144" height="72" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="718" y="404" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">artifact / image</text>
<rect x="110" y="580" width="780" height="76" rx="6" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/>
<text x="500" y="614" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">Remote build cache</text>
<text x="500" y="638" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">(azure-blob-storage, amazon-s3, or http)</text>
<line x1="208" y1="144" x2="228" y2="144" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="396" y1="144" x2="416" y2="144" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="584" y1="144" x2="604" y2="144" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="772" y1="144" x2="792" y2="144" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="200" y1="404" x2="220" y2="404" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="430" y1="404" x2="450" y2="404" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="626" y1="404" x2="646" y2="404" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="810" y1="580" x2="810" y2="180" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="872" y1="180" x2="872" y2="580" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="545" y1="440" x2="545" y2="580" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="312" y1="180" x2="312" y2="214" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dim)"/>
<text x="802" y="512" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">read</text>
<text x="880" y="512" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13">write</text>
<text x="553" y="512" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13">read</text>
</svg>
